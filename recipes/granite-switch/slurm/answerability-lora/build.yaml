#####
# Answerability LoRA adapter on granite-4.2-8b, trained with the hf-peft-sft
# step on IBM BlueVela over SLURM.
#
# ONE target. The step stages the base model (hfpull), binds the converted
# answerability dataset already on /proj (env://, no transfer), trains a LoRA
# adapter with TRL's SFTTrainer on its prompt/completion columns (loss on the
# completion only), and registers the ADAPTER as the `adapter` artifact.
#
# Hyperparameters mirror intrinsics_training's
# configs/answerability/granite_4.2_8b_lora_trl.yaml. See README.md for the
# data preparation this build expects, and what differs from that config.
#
#   gb build start -f build.yaml --param-file parameters.yaml
#   gb build start -f build.yaml --param-file parameters.yaml --param RUN_ID=r2
#####
granite.build:
  name: answerability-lora-$${RUN_ID}

  targets:

    train:
      environment_uri: "$${ENVIRONMENT_URI}"
      inputs:
        base_model:
          uri: "$${BASE_MODEL_URI}"
          type: model
        # The converted dir (data/train.parquet + data/test.parquet). It must
        # already be on BlueVela, under the container-visible
        # /proj/data-eng/llmb-read-write tree; env:// transfers nothing.
        dataset:
          uri: "$${DATASET_URI}"
          type: dataset
      outputs:
        # Written to shared /proj so it survives teardown; must match
        # hf_peft_sft_config.output_path below.
        adapter:
          uri: "env://$${ADAPTER_ROOT}/$${RUN_ID}"
          type: model
      steps:
        - step_uri: space://steps/train/hf-peft-sft
          config:
            poll_interval_seconds: $${POLL_INTERVAL_SECONDS}
            launcher_config:
              resources:
                # H200 is the only GPU ibm-bluevela schedules (its constraint).
                accelerators: "$${ACCELERATORS}"
                # gbserver drops compute_config memory on slurm; bare GiB string.
                memory: "$${MEMORY}"
              envs:
                PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
            compute_config:
              num_nodes: 1
<% if CLEARML %>
            # ClearML server credentials, from space secrets of the same names.
            skypilot:
              secrets:
                secret_names_to_use_as_env_variable:
                  - { env_name: CLEARML_API_HOST,       secret_name: CLEARML_API_HOST }
                  - { env_name: CLEARML_API_ACCESS_KEY, secret_name: CLEARML_API_ACCESS_KEY }
                  - { env_name: CLEARML_API_SECRET_KEY, secret_name: CLEARML_API_SECRET_KEY }
<% endif %>
            hf_peft_sft_config:
              method: lora
              distributed: ddp
              dataset_split: "$${DATASET_SPLIT}"
              output: adapter
              output_path: "$${ADAPTER_ROOT}/$${RUN_ID}"
              base_model_id: "$${BASE_MODEL_ID}"
              mixed_precision: bf16
              clearml_enabled: "<% if CLEARML %>true<% else %>false<% endif %>"
              clearml_project: "$${CLEARML_PROJECT}"
              clearml_task_name: "answerability-lora-$${RUN_ID}"
              lora:
                r: 16
                alpha: 32
                dropout: 0.05
                target_modules: all-linear
              # Any TRL SFTConfig field, as --<key> <value>.
              args:
                max_length: 8192
                per_device_train_batch_size: 1
                gradient_accumulation_steps: 8
                learning_rate: 5.0e-05
                lr_scheduler_type: cosine
                warmup_steps: 0.05
                weight_decay: 0.01
                num_train_epochs: $${NUM_TRAIN_EPOCHS}
                max_steps: $${MAX_STEPS}
                gradient_checkpointing: true
                dataloader_num_workers: 4
                logging_steps: 10
                seed: 0
